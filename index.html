<!DOCTYPE html>
<html lang="sv">
  <head>
    <!-- Google Analytics laddas först efter samtycke, se src/lib/consent.ts -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Takläggare Roslagen — Takbyte & Takrenovering | RoslagsTak</title>
    <meta name="description" content="RoslagsTak – takläggare i Roslagen. Takbyte, takrenovering & takomläggning på Blidö, Ljusterö, Vaxholm & Norrtälje. 10 års utförandegaranti ✓ ROT-avdrag ✓" />
    <!-- Canonical + robots are set per route via SEOHead (src/components/SEOHead.tsx).
         A static canonical here would ship a second, conflicting <link rel="canonical">. -->
    <link rel="alternate" hreflang="sv" href="https://roslagstak.se/" />
    <link rel="alternate" hreflang="x-default" href="https://roslagstak.se/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=6" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=6" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=6" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png?v=6" />
    <link rel="manifest" href="/site.webmanifest?v=6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <meta name="theme-color" content="#1a365d" />
    <!-- Prestanda: meta keywords (utan SEO-värde sedan länge) borttagen. og/twitter-metadata och
         schema.org (JSON-LD) flyttade hit, längre ner — tidiga preload-hintar för CSS/JS läggs in
         av scripts/generate-static-heads.mjs högst upp i <head> (efter charset), så webbläsaren kan
         börja hämta renderingskritisk kod direkt. Ordningen här påverkar inte JSON-LD:s giltighet. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RoslagsTak – Kustens takläggare i Roslagen" />
    <meta property="og:description" content="Professionell takläggning längs Roslagens kust och öar. TP20, tegelplåt, dubbelfalsat & mer. Kostnadsfri offert!" />
    <!-- og:url is set per route by SEOHead so it always self-references the page. -->
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:site_name" content="RoslagsTak" />
    <meta property="og:image" content="https://roslagstak.se/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RoslagsTak – Takläggare i Roslagen" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RoslagsTak – Kustens takläggare i Roslagen" />
    <meta name="twitter:description" content="Professionell takläggning längs Roslagens kust och öar. TP20, tegelplåt, dubbelfalsat & mer. Kostnadsfri offert!" />
    <meta name="twitter:image" content="https://roslagstak.se/og-image.jpg" />
    <meta name="geo.region" content="SE-AB" />
    <meta name="geo.placename" content="Norrtälje" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
