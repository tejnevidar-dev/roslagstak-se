name: seo-cc-guard

# Sökvägsspärr för SEO Command Center: en pull request från en gren som börjar på "seo-cc/" får BARA ändra filer
# under src/data/overrides/. Regelfilerna (src/data/seo-regler/), koden, workflows och allt annat är spärrat för boten.
# Körs med pull_request_target och läser fillistan via API:et, utan att checka ut eller köra PR:ens kod, så att en
# PR inte kan ändra själva spärren. Gör jobbet "guard" till ett obligatoriskt statuskrav på main (GitHub-inställning).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: read
  contents: read

jobs:
  guard:
    # Gäller grenar som heter seo-cc/… OCH varje PR som öppnats av botens GitHub-konto, oavsett grennamn
    # (IT-stöds fynd: en läckt nyckel kunde annars gå runt spärren med ett annat grennamn). Sätt repo-variabeln
    # SEO_CC_BOT_LOGIN (Settings → Secrets and variables → Actions → Variables) till botens kontonamn.
    if: startsWith(github.head_ref, 'seo-cc/') || (vars.SEO_CC_BOT_LOGIN != '' && github.event.pull_request.user.login == vars.SEO_CC_BOT_LOGIN)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kontrollera att bara src/data/overrides/ ändras
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -z "$files" ]; then
            echo "Ingen ändrad fil hittades, avvisar för säkerhets skull."
            exit 1
          fi
          # GitHubs fil-API visar högst 3 000 filer: listan måste vara lika lång som PR:ens changed_files
          listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename' | wc -l)
          if [ "$listed" -ne "$CHANGED" ]; then
            echo "::error::Fillistan ($listed) är inte lika lång som PR:ens changed_files ($CHANGED), avvisar."
            exit 1
          fi
          fel=0
          while IFS= read -r f; do
            case "$f" in
              src/data/overrides/*) ;;
              *)
                echo "::error::Bot-PR rör en fil utanför src/data/overrides/: $f"
                fel=1
                ;;
            esac
          done <<< "$files"
          if [ "$fel" -ne 0 ]; then exit 1; fi
          echo "OK: alla ändrade filer ligger under src/data/overrides/"
